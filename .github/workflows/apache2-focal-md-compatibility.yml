name: Apache Focal mod_md build compatibility probe

on:
  workflow_dispatch:
  push:
    branches: [backport/focal]
    paths:
      - '.github/workflows/apache2-focal-md-compatibility.yml'
      - 'apache2/focal/tools/probe-mod-md-build.py'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Test diagnostic mod_md load in disposable Focal container
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/mod-md-compatibility
          docker run --rm --cpus=2 --memory=4g --pids-limit=256 \
            --mount type=bind,source="$PWD",target=/repo \
            --workdir /repo \
            --env DEBIAN_FRONTEND=noninteractive \
            ubuntu:20.04 bash -euc '
              apt-get update
              apt-get install -y --no-install-recommends \
                apache2-dev build-essential dpkg-dev ca-certificates \
                libcurl4-openssl-dev libjansson-dev libssl-dev python3
              printf "deb-src http://archive.ubuntu.com/ubuntu jammy main universe\n" \
                > /etc/apt/sources.list.d/jammy-probe.list
              printf "deb-src http://archive.ubuntu.com/ubuntu jammy-updates main universe\n" \
                >> /etc/apt/sources.list.d/jammy-probe.list
              printf "deb-src http://security.ubuntu.com/ubuntu jammy-security main universe\n" \
                >> /etc/apt/sources.list.d/jammy-probe.list
              apt-get update
              mkdir -p /tmp/jammy
              (cd /tmp/jammy && apt-get source apache2=2.4.52-1ubuntu4.27)
              python3 /repo/apache2/focal/tools/probe-mod-md-build.py \
                /tmp/jammy/apache2-2.4.52 /repo/output/mod-md-compatibility
              # Deliberately test only in this disposable CI container.
              # The 2.4.48 version guard was bypassed; NEVER deploy this DSO.
              mod=/repo/output/mod-md-compatibility/mod-md-source-diagnostic/.libs/mod_md.so
              test -s "$mod"
              a2dismod md || true
              a2enmod ssl
              printf "ServerName localhost\\n" > /etc/apache2/conf-available/mod-md-probe.conf
              a2enconf mod-md-probe
              printf "LoadModule md_module %s\\n" "$mod" > /etc/apache2/mods-available/md_candidate.load
              a2enmod md_candidate
              set +e
              apache2ctl -t > /repo/output/mod-md-compatibility/load-test.log 2>&1
              code=$?
              if [ "$code" -eq 0 ]; then
                printf "mod-md-load-ok\\n" > /var/www/html/mod-md-probe.txt
                apache2ctl -k start >> /repo/output/mod-md-compatibility/load-test.log 2>&1
                code=$?
                if [ "$code" -eq 0 ]; then
                  python3 -c "import urllib.request; assert urllib.request.urlopen(\\"http://127.0.0.1/mod-md-probe.txt\\", timeout=5).read().strip() == b\\"mod-md-load-ok\\"" >> /repo/output/mod-md-compatibility/load-test.log 2>&1
                  code=$?
                  apache2ctl -k stop >> /repo/output/mod-md-compatibility/load-test.log 2>&1
                fi
              fi
              printf "\\n## Disposable-container load test\\n\\nExit code: %s\\n\\n~~~text\\n" "$code" >> /repo/output/mod-md-compatibility/report.md
              tail -n 60 /repo/output/mod-md-compatibility/load-test.log >> /repo/output/mod-md-compatibility/report.md
              printf "\\n~~~\\n\\nThis does not establish ABI or ACME/OCSP security compatibility.\\n" >> /repo/output/mod-md-compatibility/report.md
              exit "$code"
            '
          cat output/mod-md-compatibility/report.md
      - name: Publish readable mod_md diagnostic summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f output/mod-md-compatibility/report.md ]; then
            echo "No mod_md report generated" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cat output/mod-md-compatibility/report.md >> "$GITHUB_STEP_SUMMARY"
          mkdir -p apache2/focal/analysis
          cp output/mod-md-compatibility/report.md \
            apache2/focal/analysis/mod-md-compatibility-latest.md
          git fetch --no-tags origin refs/heads/backport/focal
          remote_head=$(git rev-parse FETCH_HEAD)
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo "Skipping stale report publication at $remote_head"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apache2/focal/analysis/mod-md-compatibility-latest.md
          if ! git diff --cached --quiet; then
            git commit -m "ci(focal): publish latest mod_md compatibility diagnostics"
            git push origin HEAD:backport/focal || echo "Newer branch commit won report publication race"
          fi
      - name: Upload compatibility diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apache2-focal-mod-md-compatibility-DIAGNOSTIC
          path: output/mod-md-compatibility/
          if-no-files-found: warn
          retention-days: 14
