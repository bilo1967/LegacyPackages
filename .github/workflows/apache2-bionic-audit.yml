name: Bionic selected CVE source applicability audit

on:
  workflow_dispatch:
  push:
    branches: [backport/bionic]
    paths:
      - '.github/workflows/apache2-bionic-audit.yml'
      - 'apache2/bionic/tools/audit-selected.py'

permissions:
  contents: write

jobs:
  source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact Ubuntu Bionic source and selected Jammy patch files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          docker run --rm --cpus=2 --memory=3g \
            --mount type=bind,source="$PWD",target=/repo \
            --workdir /repo \
            --env DEBIAN_FRONTEND=noninteractive \
            ubuntu:22.04 bash -euc '
              apt-get update
              apt-get install -y --no-install-recommends ca-certificates wget dpkg-dev patch python3
              mkdir -p /tmp/bionic /tmp/jammy
              cd /tmp/bionic
              base=https://archive.ubuntu.com/ubuntu/pool/main/a/apache2
              for suffix in .dsc .debian.tar.xz; do
                wget -q "$base/apache2_2.4.29-1ubuntu4.27$suffix"
              done
              wget -q "$base/apache2_2.4.29.orig.tar.gz"
              dpkg-source -x apache2_2.4.29-1ubuntu4.27.dsc
              printf "deb-src http://archive.ubuntu.com/ubuntu jammy main universe\ndeb-src http://archive.ubuntu.com/ubuntu jammy-updates main universe\ndeb-src http://security.ubuntu.com/ubuntu jammy-security main universe\n" > /etc/apt/sources.list.d/jammy-src.list
              apt-get update
              cd /tmp/jammy
              apt-get source apache2=2.4.52-1ubuntu4.27
              python3 /repo/apache2/bionic/tools/audit-selected.py \
                /tmp/bionic/apache2-2.4.29 \
                /tmp/jammy/apache2-2.4.52 \
                /repo/output/bionic-selected-patch-audit.md
            '
      - name: Publish applicability report
        uses: actions/upload-artifact@v4
        with:
          name: apache2-bionic-source-audit
          path: output/bionic-selected-patch-audit.md
          retention-days: 14
          if-no-files-found: error
      - name: Record source-only audit report in Bionic branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apache2/bionic/analysis
          cp output/bionic-selected-patch-audit.md apache2/bionic/analysis/selected-patch-audit.md
          git add apache2/bionic/analysis/selected-patch-audit.md
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "ci(bionic): publish selected patch source audit"
            git push origin HEAD:backport/bionic
          fi
