name: Experimental Apache Focal patch import

on:
  workflow_dispatch:
  push:
    branches: [backport/focal]
    paths:
      - '.github/workflows/apache2-focal-experimental.yml'
      - 'apache2/focal/tools/prepare-experimental.py'
      - 'apache2/focal/tools/test-http-headers.py'
      - 'apache2/focal/tools/test-mod-php.py'
      - 'apache2/focal/tools/fetch-legacy-php.py'
      - 'apache2/focal/tools/test-legacy-php.py'
      - 'apache2/focal/tools/test-ssl-rewrite.py'
      - 'apache2/focal/tools/test-fcgid.py'
      - 'apache2/focal/tools/test-websocket-proxy.py'

permissions:
  contents: write

jobs:
  experimental:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Build experimental source in Ubuntu Focal container
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          docker run --rm --cpus=2 --memory=4g --pids-limit=256 \
            --mount type=bind,source="$PWD",target=/repo \
            --workdir /repo \
            --env DEBIAN_FRONTEND=noninteractive \
            ubuntu:20.04 bash -euc '
              sed -n "s/^deb /deb-src /p" /etc/apt/sources.list >> /etc/apt/sources.list
              apt-get update
              apt-get install -y --no-install-recommends build-essential fakeroot dpkg-dev patch python3 ca-certificates
              apt-get build-dep -y apache2
              mkdir -p /tmp/focal /tmp/jammy /tmp/report
              (cd /tmp/focal && apt-get source apache2=2.4.41-4ubuntu3.23)
              printf "deb-src http://archive.ubuntu.com/ubuntu jammy main universe\ndeb-src http://archive.ubuntu.com/ubuntu jammy-updates main universe\ndeb-src http://security.ubuntu.com/ubuntu jammy-security main universe\n" > /etc/apt/sources.list.d/jammy-source.list
              apt-get update
              (cd /tmp/jammy && apt-get source apache2=2.4.52-1ubuntu4.27)
              rm /etc/apt/sources.list.d/jammy-source.list
              python3 /repo/apache2/focal/tools/prepare-experimental.py \
                /tmp/focal/apache2-2.4.41 /tmp/jammy/apache2-2.4.52 /tmp/report
              cd /tmp/focal/apache2-2.4.41
              dpkg-buildpackage -b -us -uc -j2
              cp /tmp/focal/*.deb /repo/output/
              cp /tmp/report/experimental-manifest.md /repo/output/
              sha256sum /repo/output/*.deb > /repo/output/SHA256SUMS
            '
      - name: Smoke-test experimental packages in disposable Focal container
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --cpus=2 --memory=2g \
            --mount type=bind,source="$PWD/output",target=/build,readonly \
            --mount type=bind,source="$PWD/apache2/focal/tools",target=/tests,readonly \
            --env DEBIAN_FRONTEND=noninteractive \
            ubuntu:20.04 bash -euc '
              apt-get update
              apt-get install -y --no-install-recommends \
                /build/apache2-data_*.deb \
                /build/apache2-utils_*.deb \
                /build/apache2-bin_*.deb \
                /build/apache2_*.deb \
                python3
              apache2ctl -t
              apache2ctl -M > /tmp/modules.txt
              apache2ctl -V > /tmp/version.txt
              grep -q "mpm_event_module" /tmp/modules.txt || grep -q "mpm_prefork_module" /tmp/modules.txt
              grep -q "Server version: Apache/2.4.41" /tmp/version.txt || apache2ctl -v
              # HTTP response header regressions after CVE-2024-42516.
              # Run only inside this disposable CI container.
              printf "unibo-focal-http-headers\\n" > /var/www/html/unibo-ci-test.txt
              echo ServerName localhost > /etc/apache2/conf-available/unibo-ci.conf
              a2enconf unibo-ci
              apache2ctl -t
              apache2ctl -k start
              python3 /tests/test-http-headers.py
              dpkg-query -W apache2 apache2-bin apache2-data apache2-utils
              cat /tmp/version.txt | head -n 16
            '
      - name: Smoke-test MPM prefork HTTP headers in disposable Focal container
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --cpus=2 --memory=2g \
            --mount type=bind,source="$PWD/output",target=/build,readonly \
            --mount type=bind,source="$PWD/apache2/focal/tools",target=/tests,readonly \
            --env DEBIAN_FRONTEND=noninteractive \
            ubuntu:20.04 bash -euc '
              apt-get update
              apt-get install -y --no-install-recommends \
                /build/apache2-data_*.deb \
                /build/apache2-utils_*.deb \
                /build/apache2-bin_*.deb \
                /build/apache2_*.deb \
                python3
              a2dismod mpm_event
              a2enmod mpm_prefork
              # Focal mod_php 7.4 requires prefork. Check the patched Apache
              # against the distro binary module in an isolated container.
              apt-get install -y --no-install-recommends libapache2-mod-php7.4
              a2enmod php7.4
              echo ServerName localhost > /etc/apache2/conf-available/unibo-ci.conf
              a2enconf unibo-ci
              printf "unibo-focal-http-headers\\n" > /var/www/html/unibo-ci-test.txt
              apache2ctl -t
              apache2ctl -M | grep -q mpm_prefork_module
              apache2ctl -M | grep -q php7_module
              printf "<?php header(\"X-Unibo-PHP: php74\"); echo PHP_MAJOR_VERSION, \".\", PHP_MINOR_VERSION, \"\\n\"; ?>" > /var/www/html/unibo-php-test.php
              apache2ctl -k start
              python3 /tests/test-http-headers.py
              python3 /tests/test-mod-php.py
            '
      - name: Smoke-test released PHP 8.3 and 8.4 modules with patched Apache
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for version in 8.3 8.4; do
            dest="output/php${version/./}"
            python3 apache2/focal/tools/fetch-legacy-php.py "$version" "$dest"
            docker run --rm --cpus=2 --memory=2g \
              --mount type=bind,source="$PWD/output",target=/build,readonly \
              --mount type=bind,source="$PWD/apache2/focal/tools",target=/tests,readonly \
              --env "PHP_VERSION=$version" \
              --env DEBIAN_FRONTEND=noninteractive \
              ubuntu:20.04 bash -euc '
                apt-get update
                apt-get install -y --no-install-recommends \
                  /build/apache2-data_*.deb \
                  /build/apache2-utils_*.deb \
                  /build/apache2-bin_*.deb \
                  /build/apache2_*.deb \
                  /build/php${PHP_VERSION/./}/*.deb \
                  python3
                a2dismod mpm_event
                a2enmod mpm_prefork
                a2enmod "php${PHP_VERSION}"
                echo ServerName localhost > /etc/apache2/conf-available/unibo-ci.conf
                a2enconf unibo-ci
                printf "<?php header(\"X-Unibo-PHP: php8\"); echo PHP_MAJOR_VERSION, \".\", PHP_MINOR_VERSION, \"\\n\"; ?>" > /var/www/html/unibo-php-test.php
                apache2ctl -t
                apache2ctl -M | grep -q mpm_prefork_module
                apache2ctl -M | grep -Eq "php[0-9]*_module"
                apache2ctl -k start
                python3 /tests/test-legacy-php.py "$PHP_VERSION"
              '
          done
      - name: Smoke-test released PHP 8.3 and 8.4 FPM through proxy_fcgi and event MPM
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for version in 8.3 8.4; do
            docker run --rm --cpus=2 --memory=2g \
              --mount type=bind,source="$PWD/output",target=/build,readonly \
              --mount type=bind,source="$PWD/apache2/focal/tools",target=/tests,readonly \
              --env "PHP_VERSION=$version" \
              --env DEBIAN_FRONTEND=noninteractive \
              ubuntu:20.04 bash -euc '
                v="${PHP_VERSION/./}"
                apt-get update
                apt-get install -y --no-install-recommends \
                  /build/apache2-data_*.deb \
                  /build/apache2-utils_*.deb \
                  /build/apache2-bin_*.deb \
                  /build/apache2_*.deb \
                  /build/php${v}/php-common_*.deb \
                  /build/php${v}/php${PHP_VERSION}-common_*.deb \
                  /build/php${v}/php${PHP_VERSION}-cli_*.deb \
                  /build/php${v}/php${PHP_VERSION}-readline_*.deb \
                  /build/php${v}/php${PHP_VERSION}-opcache_*.deb \
                  /build/php${v}/php${PHP_VERSION}-fpm_*.deb \
                  python3
                a2enmod proxy proxy_fcgi setenvif
                echo ServerName localhost > /etc/apache2/conf-available/unibo-ci.conf
                a2enconf unibo-ci
                printf "%s\n" \
                  "<FilesMatch \.php$>" \
                  "    SetHandler \"proxy:unix:/run/php/php${PHP_VERSION}-fpm.sock|fcgi://localhost/\"" \
                  "</FilesMatch>" \
                  > /etc/apache2/conf-available/unibo-fpm.conf
                a2enconf unibo-fpm
                printf "<?php header(\"X-Unibo-PHP: php8\"); echo PHP_MAJOR_VERSION, \".\", PHP_MINOR_VERSION, \"\n\"; ?>" > /var/www/html/unibo-php-test.php
                apache2ctl -t
                apache2ctl -M | grep -q mpm_event_module
                apache2ctl -M | grep -q proxy_fcgi_module
                php-fpm${PHP_VERSION} -t
                mkdir -p /run/php
                php-fpm${PHP_VERSION} -D
                test -S "/run/php/php${PHP_VERSION}-fpm.sock"
                apache2ctl -k start
                python3 /tests/test-legacy-php.py "$PHP_VERSION"
              '
          done
      - name: Smoke-test TLS and mod_rewrite on experimental Apache Focal
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --cpus=2 --memory=2g \
            --mount type=bind,source="$PWD/output",target=/build,readonly \
            --mount type=bind,source="$PWD/apache2/focal/tools",target=/tests,readonly \
            --env DEBIAN_FRONTEND=noninteractive \
            ubuntu:20.04 bash -euc '
              apt-get update
              apt-get install -y --no-install-recommends \
                /build/apache2-data_*.deb \
                /build/apache2-utils_*.deb \
                /build/apache2-bin_*.deb \
                /build/apache2_*.deb \
                openssl ssl-cert python3
              a2enmod ssl rewrite
              a2ensite default-ssl
              openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
                -keyout /etc/ssl/private/unibo-ci.key \
                -out /etc/ssl/certs/unibo-ci.pem \
                -subj /CN=localhost -addext subjectAltName=DNS:localhost
              sed -i \
                -e s@/etc/ssl/certs/ssl-cert-snakeoil.pem@/etc/ssl/certs/unibo-ci.pem@ \
                -e s@/etc/ssl/private/ssl-cert-snakeoil.key@/etc/ssl/private/unibo-ci.key@ \
                /etc/apache2/sites-available/default-ssl.conf
              echo ServerName localhost > /etc/apache2/conf-available/unibo-ci.conf
              a2enconf unibo-ci
              printf "unibo-focal-http-headers\\n" > /var/www/html/unibo-ci-test.txt
              python3 /tests/test-ssl-rewrite.py configure
              apache2ctl -t
              apache2ctl -M | grep -q ssl_module
              apache2ctl -M | grep -q rewrite_module
              apache2ctl -k start
              python3 /tests/test-ssl-rewrite.py verify
            '
      - name: Smoke-test mod_fcgid and WebSocket proxy on disposable Apache Focal
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --cpus=2 --memory=2g \
            --mount type=bind,source="$PWD/output",target=/build,readonly \
            --mount type=bind,source="$PWD/apache2/focal/tools",target=/tests,readonly \
            --env DEBIAN_FRONTEND=noninteractive \
            ubuntu:20.04 bash -euc '
              apt-get update
              apt-get install -y --no-install-recommends \
                /build/apache2-data_*.deb \
                /build/apache2-utils_*.deb \
                /build/apache2-bin_*.deb \
                /build/apache2_*.deb \
                libapache2-mod-fcgid libfcgi-dev gcc python3
              a2enmod fcgid proxy proxy_wstunnel
              echo ServerName localhost > /etc/apache2/conf-available/unibo-ci.conf
              a2enconf unibo-ci
              python3 /tests/test-fcgid.py configure
              python3 /tests/test-websocket-proxy.py configure
              apache2ctl -t
              apache2ctl -M | grep -q fcgid_module
              apache2ctl -M | grep -q proxy_wstunnel_module
              python3 /tests/test-websocket-proxy.py server &
              apache2ctl -k start
              python3 /tests/test-fcgid.py verify
              python3 /tests/test-websocket-proxy.py verify
            '
      - name: Commit exact experimental patch manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apache2/focal/analysis
          cp output/experimental-manifest.md apache2/focal/analysis/experimental-manifest.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apache2/focal/analysis/experimental-manifest.md
          if ! git diff --cached --quiet; then
            git commit -m "ci(focal): publish experimental applied/skipped patch manifest"
            git push origin HEAD:backport/focal
          fi
      - name: Upload experimental build outputs (not for production)
        uses: actions/upload-artifact@v4
        with:
          name: apache2-focal-EXPERIMENTAL
          path: output/
          retention-days: 7
          if-no-files-found: error
