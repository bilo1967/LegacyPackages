name: Bionic EXPERIMENTAL four-CVE compatibility build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Build source and binary packages in isolated Ubuntu 18.04 container
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          set +e
          docker run --rm --cpus=2 --memory=4g --pids-limit=256 \
            --mount type=bind,source="$PWD",target=/repo \
            --workdir /repo -e DEBIAN_FRONTEND=noninteractive \
            ubuntu:18.04 bash -euc '
              printf "deb http://archive.ubuntu.com/ubuntu bionic main universe\ndeb http://archive.ubuntu.com/ubuntu bionic-updates main universe\ndeb http://security.ubuntu.com/ubuntu bionic-security main universe\ndeb-src http://archive.ubuntu.com/ubuntu bionic main universe\ndeb-src http://archive.ubuntu.com/ubuntu bionic-updates main universe\ndeb-src http://security.ubuntu.com/ubuntu bionic-security main universe\n" > /etc/apt/sources.list
              apt-get update
              apt-get install -y --no-install-recommends build-essential fakeroot dpkg-dev patch quilt python3 wget ca-certificates
              apt-get build-dep -y apache2
              mkdir -p /tmp/bionic /tmp/jammy
              cd /tmp/bionic
              base=https://archive.ubuntu.com/ubuntu/pool/main/a/apache2
              for suffix in .dsc .debian.tar.xz; do
                wget -q "$base/apache2_2.4.29-1ubuntu4.27$suffix"
              done
              wget -q "$base/apache2_2.4.29.orig.tar.gz"
              dpkg-source -x apache2_2.4.29-1ubuntu4.27.dsc
              wget -q -O /tmp/jammy/debian.tar.xz "$base/apache2_2.4.52-1ubuntu4.27.debian.tar.xz"
              tar -xJf /tmp/jammy/debian.tar.xz -C /tmp/jammy
              python3 /repo/apache2/bionic/tools/prepare-four.py \
                /tmp/bionic/apache2-2.4.29 /tmp/jammy /repo/output
              cd /tmp/bionic/apache2-2.4.29
              dpkg-buildpackage -b -us -uc -j2
              cp /tmp/bionic/*.deb /repo/output/
              (cd /repo/output && sha256sum ./*.deb > SHA256SUMS)
            ' > output/build.log 2>&1
          rc=$?
          set -e
          tail -n 90 output/build.log
          if [ "$rc" -ne 0 ]; then
            tail -n 130 output/build.log > output/build-error.txt
            exit "$rc"
          fi
      - name: Preserve build failure diagnostic for review
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          test -f output/build-error.txt
          mkdir -p apache2/bionic/analysis
          cp output/build-error.txt apache2/bionic/analysis/four-cve-build-error.txt
          git add apache2/bionic/analysis/four-cve-build-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci(bionic): record four-CVE build diagnostic"
          git push origin HEAD:backport/bionic
      - name: Smoke test prefork, mod_ssl, mod_rewrite and HTTP response
        shell: bash
        run: |
          set -euo pipefail
          (cd output && sha256sum -c SHA256SUMS)
          docker run --rm --cpus=2 --memory=2g \
            --mount type=bind,source="$PWD/output",target=/build,readonly \
            -e DEBIAN_FRONTEND=noninteractive ubuntu:18.04 bash -euc '
              apt-get update
              apt-get install -y --no-install-recommends \
                /build/apache2-data_*.deb /build/apache2-utils_*.deb \
                /build/apache2-bin_*.deb /build/apache2_*.deb wget
              a2dismod mpm_event
              a2enmod mpm_prefork ssl rewrite proxy proxy_http cgi headers include
              echo ServerName localhost > /etc/apache2/conf-available/unibo-ci.conf
              a2enconf unibo-ci
              apache2ctl -t
              apache2ctl -M > /tmp/modules.txt
              for mod in mpm_prefork ssl rewrite proxy proxy_http cgi; do
                grep -q "${mod}_module" /tmp/modules.txt
              done
              printf "bionic-four-cve-ok\n" > /var/www/html/unibo-ci-test.txt
              apache2ctl -k start
              wget -qO /tmp/test-http.txt http://127.0.0.1/unibo-ci-test.txt
              grep -qx "bionic-four-cve-ok" /tmp/test-http.txt
              dpkg-query -W apache2 apache2-bin apache2-data apache2-utils
            '
      - name: Upload tested experimental packages (do not release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apache2-bionic-4CVE-EXPERIMENTAL
          path: output/
          retention-days: 7
          if-no-files-found: warn
